services:
  - type: web
    name: utsav-feed-industries
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: FARMER_APP_DEFAULT_PASSWORD
        sync: false
      - key: FIELD_APP_DEFAULT_PHONE
        sync: false
      - key: FIELD_APP_DEFAULT_PASSWORD
        sync: false
      - key: OWNER_APP_DEFAULT_NAME
        sync: false
      - key: OWNER_APP_DEFAULT_PHONE
        sync: false
      - key: OWNER_APP_DEFAULT_PASSWORD
        sync: false
      - key: GO_LIVE_RESET_TOKEN
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_TEMPLATE_NAME
        sync: false
      - key: WHATSAPP_TEMPLATE_LANGUAGE
        sync: false
      - key: WHATSAPP_GRAPH_VERSION
        sync: false
