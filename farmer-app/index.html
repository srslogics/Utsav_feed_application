<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#6f513d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Utsav Farmer" />
    <title>Utsav Farmer Login | किसान लॉगिन</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="./styles.css?v=20260602" />
  </head>
  <body class="fa-body">
    <main class="fa-login-shell">
      <section class="fa-login-panel">
        <div class="fa-brand">
          <div class="fa-brand-mark">UF</div>
          <div>
            <p class="fa-eyebrow">Farmer App | किसान ऐप</p>
            <h1>Utsav Farmer</h1>
          </div>
        </div>
        <div class="fa-copy">
          <p class="fa-eyebrow">Farm Login | लॉगिन</p>
          <h2>Daily entry aur farm update ke liye login karein.</h2>
          <div class="fa-auth-badges">
            <span>Daily report</span>
            <span>Feed update</span>
            <span>Photo upload</span>
          </div>
        </div>
      </section>

      <section class="fa-auth-card">
        <p class="fa-eyebrow">Secure Access | सुरक्षित लॉगिन</p>
        <h3>Login</h3>
        <form class="fa-form" data-farmer-login autocomplete="on">
          <label>
            Mobile Number | मोबाइल नंबर
            <input
              name="phone"
              type="tel"
              inputmode="numeric"
              placeholder="Enter mobile number"
              autocomplete="username"
              autocapitalize="off"
              spellcheck="false"
              required
            />
          </label>
          <label>
            Password | पासवर्ड
            <input name="password" type="password" placeholder="Enter password" autocomplete="current-password" required />
          </label>
          <button class="fa-primary-btn" type="submit">Login Karein | ऐप खोलें</button>
        </form>
      </section>
    </main>
    <script src="./app.js?v=20260601"></script>
  </body>
</html>
