<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Utsav Farmer Login | किसान लॉगिन</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Instrument+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/farmer-app/styles.css?v=20260516" />
  </head>
  <body class="fa-body">
    <main class="fa-login-shell">
      <section class="fa-login-panel">
        <div class="fa-brand">
          <div class="fa-brand-mark">UF</div>
          <div>
            <p class="fa-eyebrow">Farmer App | किसान ऐप</p>
            <h1>Utsav Farmer</h1>
          </div>
        </div>
        <div class="fa-copy">
          <p class="fa-eyebrow">Farm Login | लॉगिन</p>
          <h2>Daily entry aur farm update ke liye login karein.</h2>
        </div>
      </section>

      <section class="fa-auth-card">
        <p class="fa-eyebrow">Secure Access | सुरक्षित लॉगिन</p>
        <h3>Login</h3>
        <form class="fa-form" data-farmer-login>
          <label>
            Mobile Number | मोबाइल नंबर
            <input name="phone" type="tel" inputmode="numeric" placeholder="09876543210" required />
          </label>
          <label>
            Password | पासवर्ड
            <input name="password" type="password" placeholder="Apna password daalein" required />
          </label>
          <button class="fa-primary-btn" type="submit">Login Karein | ऐप खोलें</button>
        </form>
        <div class="fa-auth-meta">
          <p class="fa-form-note">Registered mobile number ko `0` ke saath daalein.</p>
        </div>
      </section>
    </main>
    <script src="/farmer-app/app.js?v=20260516"></script>
  </body>
</html>
