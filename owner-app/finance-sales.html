<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Utsav Owner Sales</title>
    <link rel="stylesheet" href="/farmer-app/styles.css?v=20260549" />
    <link rel="stylesheet" href="/owner-app/styles.css?v=20260611" />
  </head>
  <body class="fa-body owner-body" data-owner-page="finance-sales">
    <div class="fa-app-shell">
      <aside class="fa-sidebar">
        <div class="fa-brand">
          <div class="fa-brand-mark">UF</div>
          <div>
            <p class="fa-eyebrow">Owner Workspace</p>
            <h1>Utsav Owner</h1>
          </div>
        </div>
        <nav class="fa-nav">
          <a href="./dashboard.html">Dashboard</a>
          <a href="./profile.html">Profile</a>
          <a href="./farms.html">Farms</a>
          <a href="./reports.html">Reports</a>
          <a href="./files.html">Files</a>
          <a href="./parties.html">Parties</a>
          <a href="./operations-daily.html">Operations</a>
          <a class="is-active" href="./finance.html">Finance</a>
          <div class="owner-subnav" aria-label="Finance sections">
            <a href="./finance.html">Overview</a>
            <a href="./finance-costs.html">Costs</a>
            <a class="is-active" href="./finance-sales.html">Sales</a>
          </div>
        </nav>
      </aside>

      <main class="fa-content">
        <header class="fa-page-head">
          <div>
            <p class="fa-eyebrow">Finance</p>
            <h2>Sales</h2>
          </div>
          <div class="fa-page-actions">
            <a class="fa-secondary-btn" href="./profile.html">Profile</a>
            <button class="fa-secondary-btn" type="button" data-owner-logout>Logout</button>
          </div>
        </header>

        <nav class="owner-mobile-section-nav" aria-label="Finance sections">
          <a href="./finance.html">Overview</a>
          <a href="./finance-costs.html">Costs</a>
          <a class="is-active" href="./finance-sales.html">Sales</a>
        </nav>

        <section class="fa-section">
          <div class="fa-section-head">
            <div>
              <p class="fa-eyebrow">Entry</p>
              <h3>Add sale</h3>
            </div>
          </div>
          <form class="fa-form owner-form-grid" data-owner-sale-form autocomplete="off">
            <label>
              Farm
              <select name="farmer_code" data-owner-sale-farm-select required>
                <option value="">Choose farm</option>
              </select>
            </label>
            <label>
              Date
              <input name="entry_date" type="date" required />
            </label>
            <label>
                Bill no.
                <input name="bill_number" type="text" placeholder="Bill number" required />
            </label>
            <label>
              Party name
              <select name="party_name" data-owner-sale-party-select required>
                <option value="">Choose party</option>
              </select>
            </label>
            <label>
                Kgs
                <input name="total_weight_kg" type="text" placeholder="Kgs" required />
            </label>
            <label>
                Rate
                <input name="rate_per_kg" type="text" placeholder="Rate per kg" required />
            </label>
            <label>
                Amount
                <input name="amount" type="text" placeholder="Auto" readonly />
              </label>
            <label class="full">
              Bill / receipt
              <input name="file" type="file" accept="image/*,.pdf,.jpg,.jpeg,.png,.webp" />
            </label>
            <div class="fa-form-actions full">
              <button class="fa-primary-btn" type="submit">Save sale</button>
            </div>
          </form>
          <p class="fa-status-message owner-sale-note"></p>
        </section>

        <section class="fa-section">
          <div class="fa-section-head">
            <div>
              <p class="fa-eyebrow">History</p>
              <h3>Sales</h3>
            </div>
          </div>
          <div class="fa-list-card" id="owner-finance-sales"></div>
        </section>
      </main>
    </div>
    <nav class="fa-bottom-nav owner-bottom-nav owner-bottom-nav-six">
      <a href="./dashboard.html">Home</a>
      <a href="./farms.html">Farms</a>
      <a href="./reports.html">Reports</a>
      <a href="./files.html">Files</a>
      <a href="./operations-daily.html">Ops</a>
      <a class="is-active" href="./finance.html">Finance</a>
    </nav>
    <script src="/owner-app/app.js?v=20260611"></script>
  </body>
</html>
