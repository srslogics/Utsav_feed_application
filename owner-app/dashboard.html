<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Utsav Owner Dashboard</title>
    <link rel="stylesheet" href="/farmer-app/styles.css?v=20260549" />
    <link rel="stylesheet" href="/owner-app/styles.css?v=20260607" />
  </head>
  <body class="fa-body owner-body" data-owner-page="dashboard">
    <div class="fa-app-shell">
      <aside class="fa-sidebar">
        <div class="fa-brand">
          <div class="fa-brand-mark">UF</div>
          <div>
            <p class="fa-eyebrow">Owner Workspace</p>
            <h1>Utsav Owner</h1>
          </div>
        </div>
        <nav class="fa-nav">
          <a class="is-active" href="./dashboard.html">Dashboard</a>
          <a href="./profile.html">Profile</a>
          <a href="./farms.html">Farms</a>
          <a href="./reports.html">Reports</a>
          <a href="./files.html">Files</a>
          <a href="./parties.html">Parties</a>
          <a href="./operations-daily.html">Operations</a>
          <a href="./finance.html">Finance</a>
        </nav>
        <div class="fa-farm-strip">
          <span data-owner-name></span>
          <strong data-owner-title></strong>
          <small data-owner-cluster></small>
        </div>
      </aside>

      <main class="fa-content">
        <header class="fa-page-head">
          <div>
            <p class="fa-eyebrow">Owner App</p>
            <h2>Home</h2>
          </div>
          <div class="fa-page-actions">
            <a class="fa-secondary-btn" href="./profile.html">Profile</a>
            <button class="fa-secondary-btn" type="button" data-owner-logout>Logout</button>
          </div>
        </header>

        <section class="owner-dashboard-shortcuts">
          <a class="owner-dashboard-shortcut" href="./farms.html">
            <span>Open</span>
            <strong>Farms</strong>
          </a>
          <a class="owner-dashboard-shortcut" href="./operations-daily.html">
            <span>Open</span>
            <strong>Operations</strong>
          </a>
          <a class="owner-dashboard-shortcut" href="./finance.html">
            <span>Open</span>
            <strong>Finance</strong>
          </a>
          <a class="owner-dashboard-shortcut" href="./reports.html">
            <span>Open</span>
            <strong>Reports</strong>
          </a>
        </section>

        <section class="fa-section">
          <div class="fa-section-head">
            <div>
              <p class="fa-eyebrow">Snapshot</p>
              <h3>Numbers</h3>
            </div>
          </div>
          <div class="fa-kpi-grid fa-kpi-grid-six" id="owner-kpis"></div>
        </section>

        <section class="owner-grid-two">
          <section class="fa-section">
            <div class="fa-section-head">
              <div>
                <p class="fa-eyebrow">Alerts</p>
                <h3>Attention</h3>
              </div>
            </div>
            <div class="fa-list-card" id="owner-priority"></div>
          </section>

          <section class="fa-section">
            <div class="fa-section-head">
              <div>
                <p class="fa-eyebrow">Latest</p>
                <h3>Entries</h3>
              </div>
            </div>
            <div class="fa-list-card" id="owner-latest-reporting"></div>
          </section>
        </section>

        <section class="fa-section">
          <div class="fa-section-head">
            <div>
              <p class="fa-eyebrow">Farms</p>
              <h3>Farm list</h3>
            </div>
          </div>
          <div class="fa-list-card" id="owner-farms"></div>
        </section>
      </main>
    </div>
    <nav class="fa-bottom-nav owner-bottom-nav owner-bottom-nav-six">
      <a class="is-active" href="./dashboard.html">Home</a>
      <a href="./farms.html">Farms</a>
      <a href="./reports.html">Reports</a>
      <a href="./files.html">Files</a>
      <a href="./operations-daily.html">Ops</a>
      <a href="./finance.html">Finance</a>
    </nav>
    <script src="/owner-app/app.js?v=20260603"></script>
  </body>
</html>
