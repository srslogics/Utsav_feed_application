<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Utsav Owner Parties</title>
    <link rel="stylesheet" href="../farmer-app/styles.css?v=20260549" />
    <link rel="stylesheet" href="./styles.css?v=20260611" />
  </head>
  <body class="fa-body owner-body" data-owner-page="parties">
    <div class="fa-app-shell">
      <aside class="fa-sidebar">
        <div class="fa-brand">
          <div class="fa-brand-mark">UF</div>
          <div>
            <p class="fa-eyebrow">Owner Workspace</p>
            <h1>Utsav Owner</h1>
          </div>
        </div>
        <nav class="fa-nav">
          <a href="./dashboard.html">Dashboard</a>
          <a href="./profile.html">Profile</a>
          <a href="./farms.html">Farms</a>
          <a href="./reports.html">Reports</a>
          <a href="./files.html">Files</a>
          <a class="is-active" href="./parties.html">Parties</a>
          <a href="./operations-daily.html">Operations</a>
          <a href="./finance.html">Finance</a>
        </nav>
        <div class="fa-farm-strip">
          <span data-owner-name></span>
          <strong data-owner-title></strong>
          <small data-owner-cluster></small>
        </div>
      </aside>

      <main class="fa-content">
        <header class="fa-page-head">
          <div>
            <p class="fa-eyebrow">Parties</p>
            <h2>Parties</h2>
          </div>
          <div class="fa-page-actions">
            <a class="fa-secondary-btn" href="./profile.html">Profile</a>
            <button class="fa-secondary-btn" type="button" data-owner-logout>Logout</button>
          </div>
        </header>

        <section class="owner-grid-two owner-grid-two-top">
          <section class="fa-section">
            <div class="fa-section-head">
              <div>
                <p class="fa-eyebrow">List</p>
                <h3>Party contacts</h3>
              </div>
            </div>
            <div class="fa-list-card" id="owner-party-directory"></div>
          </section>

          <section class="fa-section" id="owner-sale-rule-anchor">
            <div class="fa-section-head">
              <div>
                <p class="fa-eyebrow">Alerts</p>
                <h3>Sale trigger</h3>
              </div>
            </div>
            <p class="fa-form-note owner-party-meta-note" id="owner-whatsapp-note"></p>
            <div class="fa-list-card" id="owner-sale-rule-list"></div>
          </section>
        </section>

        <section class="owner-management-grid owner-management-grid-party">
          <section class="fa-section">
            <div class="fa-section-head">
              <div>
                <p class="fa-eyebrow">Entry</p>
                <h3>Add party</h3>
              </div>
            </div>
            <form class="fa-form owner-form-grid" data-owner-party-form autocomplete="off">
              <input name="party_id" type="hidden" />
              <label>
                Party Name
                <input name="name" type="text" placeholder="Party name" required />
              </label>
              <label>
                WhatsApp Number
                <input name="phone" type="tel" inputmode="numeric" placeholder="WhatsApp number" required />
              </label>
              <label>
                Market / Area
                <input name="market_area" type="text" placeholder="Market or area" />
              </label>
              <label>
                Preferred Clusters
                <input name="preferred_clusters" type="text" placeholder="Clusters" />
              </label>
              <label class="full">
                Preferred Farms or Codes
                <input name="preferred_farms" type="text" placeholder="Farms or codes" />
              </label>
              <label class="full">
                Notes
                <textarea name="notes" rows="4" placeholder="Notes"></textarea>
              </label>
              <label class="owner-checkbox full">
                <input name="is_active" type="checkbox" checked />
                <span>Keep this party active for sale alerts</span>
              </label>
              <div class="owner-form-actions full">
                <button class="fa-primary-btn" type="submit" data-owner-party-submit>Save Party</button>
                <button class="fa-secondary-btn" type="button" data-owner-party-cancel hidden>Cancel Edit</button>
              </div>
            </form>
            <p class="fa-form-note owner-party-note"></p>
          </section>

          <section class="fa-section">
            <div class="fa-section-head">
              <div>
                <p class="fa-eyebrow">Weight</p>
                <h3>Farm trigger</h3>
              </div>
            </div>
            <form class="fa-form owner-form-grid" data-owner-sale-rule-form autocomplete="off">
              <label>
                Farm
                <select name="farmer_code" data-owner-rule-farm-select>
                  <option value="">Choose farm</option>
                </select>
              </label>
              <label>
                Ready Weight (g)
                <input name="ready_weight_g" type="number" min="0" placeholder="Weight" />
              </label>
              <label class="owner-checkbox full">
                <input name="auto_whatsapp_enabled" type="checkbox" />
                <span>Enable auto WhatsApp when setup is ready</span>
              </label>
              <label class="full">
                Trigger Note
                <textarea name="notes" rows="4" placeholder="Notes"></textarea>
              </label>
              <button class="fa-primary-btn" type="submit">Save Trigger</button>
            </form>
            <p class="fa-form-note owner-sale-rule-note"></p>
          </section>
        </section>

        <section class="fa-section">
          <div class="fa-section-head">
            <div>
              <p class="fa-eyebrow">Queue</p>
              <h3>Ready farms</h3>
            </div>
          </div>
          <div class="owner-sale-card-grid" id="owner-sale-ready-queue"></div>
        </section>
      </main>
    </div>
    <nav class="fa-bottom-nav owner-bottom-nav owner-bottom-nav-six">
      <a href="./dashboard.html">Home</a>
      <a href="./farms.html">Farms</a>
      <a href="./reports.html">Reports</a>
      <a href="./files.html">Files</a>
      <a href="./operations-daily.html">Ops</a>
      <a href="./finance.html">Finance</a>
    </nav>
    <script src="./app.js?v=20260611"></script>
  </body>
</html>
