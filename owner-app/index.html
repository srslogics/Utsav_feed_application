<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Utsav Owner Login</title>
    <link rel="stylesheet" href="/farmer-app/styles.css?v=20260522" />
    <link rel="stylesheet" href="/owner-app/styles.css?v=20260523" />
  </head>
  <body class="fa-body owner-body">
    <main class="fa-login-shell">
      <section class="fa-login-panel">
        <div class="fa-brand">
          <div class="fa-brand-mark">UF</div>
          <div>
            <p class="fa-eyebrow">Owner Workspace</p>
            <h1>Utsav Owner App</h1>
          </div>
        </div>
        <div class="fa-copy">
          <p class="fa-eyebrow">Owner Login</p>
          <h2>Owner aur management access ke liye login karein.</h2>
        </div>
      </section>

      <section class="fa-auth-card">
        <p class="fa-eyebrow">Secure Access</p>
        <h3>Owner login</h3>
        <form class="fa-form" data-owner-login>
          <label>
            Mobile Number
            <input name="phone" type="tel" inputmode="numeric" placeholder="09999999999" required />
          </label>
          <label>
            Password
            <input name="password" type="password" placeholder="Password daalein" required />
          </label>
          <button class="fa-primary-btn" type="submit">Open Owner App</button>
        </form>
        <p class="fa-form-note">Registered mobile number ko `0` ke saath daalein.</p>
      </section>
    </main>
    <script src="/owner-app/app.js?v=20260524"></script>
  </body>
</html>
