<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Utsav Owner Login</title>
    <link rel="stylesheet" href="/farmer-app/styles.css?v=20260549" />
    <link rel="stylesheet" href="/owner-app/styles.css?v=20260561" />
  </head>
  <body class="fa-body owner-body">
    <main class="fa-login-shell">
      <section class="fa-login-panel">
        <div class="fa-brand">
          <div class="fa-brand-mark">UF</div>
          <div>
            <p class="fa-eyebrow">Owner Workspace</p>
            <h1>Utsav Owner</h1>
          </div>
        </div>
        <div class="fa-copy">
          <p class="fa-eyebrow">Finance Console</p>
          <h2>Owner aur management control ek hi jagah.</h2>
        </div>
      </section>

      <section class="fa-auth-card">
        <p class="fa-eyebrow">Utsav Owner</p>
        <h3>Login</h3>
        <form class="fa-form" data-owner-login autocomplete="on">
          <label>
            Mobile Number
            <input
              name="phone"
              type="tel"
              inputmode="numeric"
              placeholder="Enter mobile number"
              autocomplete="username"
              autocapitalize="off"
              spellcheck="false"
              required
            />
          </label>
          <label>
            Password
            <input name="password" type="password" placeholder="Enter password" autocomplete="current-password" required />
          </label>
          <button class="fa-primary-btn" type="submit">Open Owner App</button>
        </form>
      </section>
    </main>
    <script src="/owner-app/app.js?v=20260570"></script>
  </body>
</html>
